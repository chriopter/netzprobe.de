name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  build:
    name: Tests und Build
    runs-on: ubuntu-latest
    steps:
      - name: Auschecken
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Frontend-Tests und Produktionsbuild
        run: |
          npm test
          npm run build
      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2
      - name: Rust-Tests
        run: cargo test --release --workspace
