[package]
name = "netzprobe-api"
version = "0.1.0"
edition = "2024"
# Neben dem API-Server existiert das Szenario-Check-CLI (src/bin/simulate.rs);
# cargo run soll weiterhin den Server starten.
default-run = "netzprobe-api"

[dependencies]
axum = "*"
netzprobe-kern = { path = "../model/kern/kern" }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
tokio = { version = "*", features = ["macros", "rt-multi-thread", "net", "signal"] }
